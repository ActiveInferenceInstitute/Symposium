[project]
name = "symposium"
version = "3.2.0"
description = "Research analysis and project generation for Active Inference Symposium"
authors = [{name = "Active Inference Institute"}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=3.1.0",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "backoff>=2.2.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "nltk>=3.10.4",
    "wordcloud>=1.9.6",
    "networkx>=3.7",
    "adjustText>=1.4.0",
    "scipy>=1.18.1",
    "icalendar>=7.3.0",
    "pytz>=2026.6",
    "pillow>=13.0.0",
    "pypdf>=6.21.4,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://activeinferenceinstitute.github.io/Symposium/"
Documentation = "https://activeinferenceinstitute.github.io/Symposium/methods.html"
Repository = "https://github.com/ActiveInferenceInstitute/Symposium"
Issues = "https://github.com/ActiveInferenceInstitute/Symposium/issues"
Changelog = "https://github.com/ActiveInferenceInstitute/Symposium/blob/main/CHANGELOG.md"

[project.scripts]
symposium = "symposium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symposium"]

# Keep historical datasets, rendered outputs, and local evidence in the Git repository,
# rather than bundling them into every source installation.
[tool.hatch.build.targets.sdist]
exclude = [
    "/archive",
    "/outputs",
    "/data/inputs/aif_2024",
    "/data/inputs/aif_2025",
    "/.omo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src/symposium --cov-report=html --cov-report=term --cov-fail-under=80"
markers = [
    "real_api: tests that call live LLM provider APIs (opt-in via -m real_api; require API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false


[tool.uv]
required-version = ">=0.13.5"
