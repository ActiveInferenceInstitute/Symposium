[project]
name = "symposium"
version = "3.1.0"
description = "Research analysis and project generation for Active Inference Symposium"
authors = [{name = "Active Inference Institute"}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "backoff>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
    "wordcloud>=1.9.0",
    "networkx>=3.0",
    "adjustText>=0.8",
    "scipy>=1.10.0",
    "icalendar>=5.0.0",
    "pytz>=2023.0",
    "pillow>=10.0.0",
    "pypdf>=6.21.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://activeinferenceinstitute.github.io/Symposium/"
Documentation = "https://activeinferenceinstitute.github.io/Symposium/methods.html"
Repository = "https://github.com/ActiveInferenceInstitute/Symposium"
Issues = "https://github.com/ActiveInferenceInstitute/Symposium/issues"
Changelog = "https://github.com/ActiveInferenceInstitute/Symposium/blob/main/CHANGELOG.md"

[project.scripts]
symposium = "symposium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symposium"]

# Keep historical datasets, rendered outputs, and local evidence in the Git repository,
# rather than bundling them into every source installation.
[tool.hatch.build.targets.sdist]
exclude = [
    "/archive",
    "/outputs",
    "/data/inputs/aif_2024",
    "/data/inputs/aif_2025",
    "/.omo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src/symposium --cov-report=html --cov-report=term --cov-fail-under=80"
markers = [
    "real_api: tests that call live LLM provider APIs (opt-in via -m real_api; require API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false


[tool.uv]
required-version = ">=0.13.5"
