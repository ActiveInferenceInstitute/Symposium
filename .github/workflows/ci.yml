name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/ run.py launch.py
      - name: Format
        run: uv run --no-sync ruff format --check src/ tests/ run.py launch.py
      - name: Tests and coverage gate
        run: uv run --no-sync python -m pytest --no-header
      - name: Build distribution
        run: uv build
      - name: Offline edition scaffold
        run: |
          uv run --no-sync symposium --version
          uv run --no-sync symposium edition validate --year 2026
      - name: Verify approved public program and renderer
        run: |
          uv run --no-sync symposium organize check-public --public-dir data/public/2026
          uv run --no-sync symposium organize readiness --public-dir data/public/2026
          uv run --no-sync symposium organize site --public-dir data/public/2026 --output-dir "$RUNNER_TEMP/symposium-public-site"
