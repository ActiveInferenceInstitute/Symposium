name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs `./gate.sh <arm>`. The arm definitions live only in gate.sh, so a
# local run and this workflow cannot drift; see docs/development.md. Lint and docs
# run once here rather than in every matrix entry, and the build/program arms run
# on the 3.12 pin instead of all three interpreters.

env:
  UV_VERSION: "0.13.5"

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Lint arm
        run: ./gate.sh lint
      - name: Documentation arm
        run: ./gate.sh docs

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Test arm
        run: ./gate.sh test

  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Build arm
        run: ./gate.sh build
      - name: Program arm
        run: ./gate.sh program

  # Pin: .github/gnn-pin.json (schema gnn-importer-pin/v1). The arm installs the
  # pinned parser in an isolated environment and verifies it; it needs no project
  # dependency environment.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: GNN conformance arm
        run: ./gate.sh gnn
