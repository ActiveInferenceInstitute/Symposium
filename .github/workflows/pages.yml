name: Publish approved Symposium Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/public/2026/**'
      - 'src/symposium/organizing/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'gate.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symposium-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 120
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Install locked public renderer
        run: uv sync --locked --python 3.12
      - name: Verify approved publication and build static site
        env:
          GATE_SITE_OUT: _site
        run: ./gate.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
